name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 首页「更新日志」栏要读 git log 生成 changelog.json，浅克隆会让记录不全
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (含 prebuild：搜索索引 / RSS / 更新日志)
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # 编辑此处：在仓库 Settings → Secrets 里配置这两个值
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=text-only-blog
